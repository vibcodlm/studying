<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="app.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Mini shop</h1><hr>
    <h3>Cart</h3>
    <button id="show-cart" type="button" onclick="toggleCart()">Show cart</button>
    <section id="cart" class="hiden">
        <p id="cart-info">Cart is empty</p>
        <button id="delete" type="button">delete</button>
    </section>
    <br>
    <input type="search" id="search" placeholder="Поиск товаров">
    <br>
    <label for="cetegory">Category</label>
    <select id="category">
        <option value="all">All</option>
        <option value="electronics">Electronics</option>
        <option value="jewelery">Jewelery</option>
        <option value="men's clothing">Men's clothing</option>
        <option value="women's clothing">Women's clothing</option>
    </select>

    <div class="prod" id="prod"></div>
</body>
</html>
